<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توزيع الخطب — أوقاف 15 مايو</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <style>
    .table-header, .table-row { grid-template-columns: 1.6fr 1fr 2.2fr 1fr; }
    .friday-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      padding: 8px 16px; border-radius: 50px; border: 2px solid var(--line);
      background: #f8fafc; cursor: pointer; font-family: inherit; font-size: .85em; font-weight: 600;
    }
    .chip:hover { border-color: var(--blue); }
    .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .row-select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: .9em; background: #fff; }
    .row-select:focus { border-color: var(--blue); outline: none; }
    .row-select.conflict { border-color: var(--err); background: #fef2f2; }
    .khatib-trigger {
      text-align: right;
      cursor: pointer;
      position: relative;
      padding-left: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      line-height: 1.5;
      color: inherit;
    }
    .khatib-trigger::after {
      content: "▾";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85em;
      pointer-events: none;
    }
    .sticky-bar {
      position: sticky; top: 0; z-index: 10; background: #fff;
      padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 12px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h1><span>📅</span> توزيع الخطب</h1>

    <div class="friday-chips" id="fridayChips"></div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
      <div class="field" style="flex:1;min-width:170px">
        <label for="dateInput">التاريخ</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field" style="display:flex;align-items:center;gap:8px;padding-bottom:10px">
        <input type="checkbox" id="specialToggle" style="width:auto">
        <label for="specialToggle" style="margin:0">مناسبة خاصة</label>
      </div>
      <div class="field" id="labelField" style="flex:1;min-width:170px;display:none">
        <label for="labelInput">اسم المناسبة</label>
        <input type="text" id="labelInput" placeholder="الأولى من شوال">
      </div>
    </div>

    <div id="dateNotice"></div>
    <div id="main"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    renderNav('schedule.html');

    var state = {
      date: '',
      version: '',
      rows: [],          // صفوف الجدول من السيرفر
      khatibs: [],
      mosques: {},
      prefsByKhatib: {}, // khatibId -> Set(mosqueId)
      loadCount: {},     // khatibId -> عدد الخطب في الفترة القادمة
      dirty: {},         // mosqueId -> { khatibId, status }
      filterEmpty: false,
      search: '',
      conflictMosques: [],
    };

    (async function () {
      renderChips();
      var f = nextFridays(1)[0];
      el('dateInput').value = f;

      var fs = nextFridays(8);
      state._window = { from: fs[0], to: fs[fs.length - 1] };

      var authPromise = requireAuth();
      if (!getToken()) { await authPromise; return; }

      try {
        await Promise.all([
          authPromise,
          loadReference(),
          load(f)
        ]);
      } catch (e) {
        appReady();
      }
    })();

    // ── اختيار التاريخ ───────────────────────────────────────

    function renderChips() {
      el('fridayChips').innerHTML = nextFridays(4).map(function (d) {
        return '<button class="chip" data-date="' + d + '">' + esc(formatDate(d)) + '</button>';
      }).join('');
      el('fridayChips').querySelectorAll('.chip').forEach(function (c) {
        c.onclick = function () {
          if (!confirmLeave()) return;
          el('dateInput').value = c.dataset.date;
          el('specialToggle').checked = false;
          el('labelField').style.display = 'none';
          load(c.dataset.date);
        };
      });
    }

    el('specialToggle').onchange = function () {
      el('labelField').style.display = this.checked ? 'block' : 'none';
    };

    el('dateInput').onchange = function () {
      var d = this.value;
      if (!d) return;
      if (!el('specialToggle').checked && !isFriday(d)) {
        toast('اختر يوم جمعة، أو فعّل "مناسبة خاصة"', 'warn');
        return;
      }
      if (!confirmLeave()) { this.value = state.date; return; }
      load(d);
    };

    function confirmLeave() {
      if (!Object.keys(state.dirty).length) return true;
      return confirmBox('فيه تعديلات لسه متحفظتش. تسيب الصفحة؟');
    }

    window.addEventListener('beforeunload', function (e) {
      if (Object.keys(state.dirty).length) { e.preventDefault(); e.returnValue = ''; }
    });

    // ── تحميل ────────────────────────────────────────────────

    async function loadReference() {
      var res = await Promise.all([api('listKhatibs'), api('listMosques')]);
      var data = res[0];
      var m = res[1];

      state.khatibs = data.khatibs;
      state.prefsByKhatib = {};
      data.khatibs.forEach(function (k) {
        state.prefsByKhatib[k.id] = new Set(k.preferences || []);
      });

      state.mosques = {};
      m.mosques.forEach(function (x) { state.mosques[x.id] = x; });
    }

    async function load(date) {
      state.date = date;
      state.dirty = {};
      state.conflictMosques = [];
      state.filterEmpty = false;
      state.search = '';
      el('dateNotice').innerHTML = '';
      showLoading(el('main'), 'جاري تحميل التوزيع...');

      try {
        var results = await Promise.all([
          api('getSchedule', { date: date }),
          refreshLoadCounts()
        ]);
        var d = results[0];
        state.version = d.version;
        state.rows = d.rows;

        if (!d.exists) { renderGenerate(); appReady(); return; }
        render();
      } catch (e) {
        showError(el('main'), e.message, function () { load(date); });
      } finally {
        appReady();
      }
    }

    /**
     * عدد الخطب لكل خطيب في الجُمع الثمانية القادمة — بيظهر جنب الاسم عشان
     * الظلم في التوزيع يبان لحظة الاختيار. طلب واحد، والفشل فيه مايوقفش الشاشة.
     */
    async function refreshLoadCounts() {
      try {
        var res = await api('getLoadCounts', state._window);
        state.loadCount = res.counts || {};
      } catch (e) { state.loadCount = {}; }
    }

    // ── التوليد ──────────────────────────────────────────────

    function renderGenerate() {
      var special = el('specialToggle').checked;
      if (!canEdit()) {
        el('main').innerHTML =
          '<div class="state"><span class="state-icon">📋</span>' +
          '<p>لم يتم إنشاء ' + (special ? 'هذه المناسبة' : 'هذه الجمعة') + ' بعد</p></div>';
        return;
      }
      el('main').innerHTML =
        '<div class="state"><span class="state-icon">📋</span>' +
        '<p>لم يتم إنشاء ' + (special ? 'هذه المناسبة' : 'هذه الجمعة') + ' بعد</p>' +
        '<button class="btn" id="genBtn" title="آمن تضغطه أكتر من مرة — مش هيكرر ولا هيمسح حاجة">' +
        (special ? 'توليد المناسبة' : 'توليد الجمعة') + '</button></div>';

      el('genBtn').onclick = async function () {
        this.disabled = true;
        this.textContent = 'جاري التوليد...';
        try {
          var payload = { date: state.date };
          if (special) {
            payload.dateType = 'special';
            payload.label = el('labelInput').value.trim();
            if (!payload.label) { toast('اكتب اسم المناسبة', 'warn'); this.disabled = false; this.textContent = 'توليد المناسبة'; return; }
          }
          var d = await api('generateDate', payload);
          state.rows = d.rows;
          state.version = d.version;
          el('dateNotice').innerHTML = '<div class="notice notice-info">تم إنشاء ' +
            d.created + ' مسجد — <strong>' + d.prefilled + '</strong> اتملى تلقائيًا من الخطباء الثابتين، <strong>' +
            (d.created - d.prefilled) + '</strong> محتاجين توزيع</div>';
          await refreshLoadCounts();
          render();
        } catch (e) {
          toast(e.message, 'err');
          this.disabled = false;
          this.textContent = special ? 'توليد المناسبة' : 'توليد الجمعة';
        }
      };
    }

    // ── العرض ────────────────────────────────────────────────

    function effective(r) {
      var d = state.dirty[r.mosqueId] || state.dirty[String(r.mosqueId)];
      return d ? { khatibId: d.khatibId, status: d.status } : { khatibId: r.khatibId, status: r.status };
    }

    /** الخطباء المحجوزين في مساجد تانية نفس التاريخ. */
    function bookedMap(exceptMosqueId) {
      var m = {};
      var exStr = String(exceptMosqueId || '');
      state.rows.forEach(function (r) {
        if (String(r.mosqueId) === exStr) return;
        var e = effective(r);
        if (e.khatibId) m[String(e.khatibId)] = String(r.mosqueId);
      });
      return m;
    }

    var activeTomSelect = null;
    var activeMosqueId = null;

    function destroyActiveTomSelect() {
      var id = activeMosqueId;
      var ts = activeTomSelect;
      activeTomSelect = null;
      activeMosqueId = null;
      if (ts) {
        try { ts.destroy(); } catch (e) {}
      }
      if (id) {
        updateRow(id);
      }
    }

    function render() {
      destroyActiveTomSelect();

      el('main').innerHTML =
        '<div class="sticky-bar">' +
          '<button class="btn btn-sm" id="emptyBtn"></button>' +
          '<button class="btn btn-plain btn-sm" id="allBtn" style="display:none">عرض الكل</button>' +
          '<span style="flex:1"></span>' +
          (canEdit() ? '<button class="btn btn-sm btn-plain" id="regenBtn" title="يضيف المساجد الجديدة ويملّي الفاضي بالخطيب الثابت">🔄 إعادة التوليد</button>' : '') +
          '<button class="btn btn-sm btn-plain" id="pdfBtn">📄 استخراج PDF</button>' +
          (canEdit() ? '<button class="btn btn-sm" id="saveBtn" disabled>حفظ</button>' : '') +
        '</div>' +
        '<div class="search-box"><span class="search-icon">🔍</span>' +
          '<input type="text" class="search-input" id="mosqueSearch" placeholder="ابحث باسم المسجد أو المجاورة..." value="' + esc(state.search) + '"></div>' +
        '<div id="pdfArea">' +
          '<h2 style="text-align:center;color:var(--navy);font-size:1em;margin-bottom:10px">توزيع ' + esc(formatDate(state.date)) + '</h2>' +
          tableHtml(state.rows) +
          '<div id="noResults" class="state" style="display:none"><p>لا توجد نتائج</p></div>' +
        '</div>';

      updateStickyBar();
      applyFilters();
      wire();
    }

    function updateStickyBar() {
      var emptyCount = state.rows.filter(function (r) { return !effective(r).khatibId; }).length;
      var dirtyCount = Object.keys(state.dirty).length;

      var emptyBtn = el('emptyBtn');
      if (emptyBtn) {
        emptyBtn.className = 'btn ' + (emptyCount ? 'btn-danger' : 'btn-ok') + ' btn-sm';
        emptyBtn.textContent = emptyCount ? ('متبقي بدون خطيب: ' + emptyCount) : 'كل المساجد متوزعة ✓';
      }

      var allBtn = el('allBtn');
      if (allBtn) {
        allBtn.style.display = state.filterEmpty ? 'inline-block' : 'none';
      }

      var saveBtn = el('saveBtn');
      if (saveBtn) {
        if (!canEdit()) {
          saveBtn.style.display = 'none';
        } else {
          saveBtn.style.display = '';
          saveBtn.disabled = !dirtyCount;
          saveBtn.textContent = 'حفظ' + (dirtyCount ? ' (' + dirtyCount + ')' : '');
        }
      }
    }

    function applyFilters() {
      var query = (el('mosqueSearch') ? el('mosqueSearch').value : state.search) || '';
      state.search = query;
      var visibleCount = 0;

      var rowEls = document.querySelectorAll('.table-container .table-row');
      rowEls.forEach(function (rowEl) {
        var mosqueId = rowEl.dataset.mosque;
        var r = state.rows.find(function (x) { return String(x.mosqueId) === String(mosqueId); });
        if (!r) return;

        var eff = effective(r);
        var matchesEmpty = !state.filterEmpty || !eff.khatibId;

        var matchesSearch = true;
        if (query) {
          var m = state.mosques[r.mosqueId] || state.mosques[String(r.mosqueId)] || {};
          matchesSearch = matches(m.name || r.mosque, query) || matches(m.mujawra || r.mujawra, query);
        }

        var isVisible = matchesEmpty && matchesSearch;
        rowEl.style.display = isVisible ? '' : 'none';
        if (isVisible) visibleCount++;
      });

      var noResultsEl = el('noResults');
      var tableHeader = document.querySelector('.table-header');
      if (noResultsEl) {
        noResultsEl.style.display = visibleCount === 0 ? 'block' : 'none';
      }
      if (tableHeader) {
        tableHeader.style.display = visibleCount === 0 ? 'none' : 'grid';
      }
    }

    function tableHtml(rows) {
      return '<div class="table-container">' +
        '<div class="table-header"><div>🕌 المسجد</div><div>📍 المجاورة</div><div>🎙️ الخطيب</div><div>الحالة</div></div>' +
        rows.map(rowHtml).join('') + '</div>';
    }

    function rowHtml(r) {
      var m = state.mosques[r.mosqueId] || state.mosques[String(r.mosqueId)] || {};
      var e = effective(r);
      var cls = 'table-row' + (state.dirty[r.mosqueId] || state.dirty[String(r.mosqueId)] ? ' dirty' : '') + (!e.khatibId ? ' empty-slot' : '');
      return '<div class="' + cls + '" data-mosque="' + esc(r.mosqueId) + '">' +
        '<div data-label="المسجد">' + esc(m.name || r.mosque) + '</div>' +
        '<div data-label="المجاورة"><span class="area-badge">' + esc(m.mujawra || '—') + '</span></div>' +
        '<div data-label="الخطيب">' + khatibButtonHtml(r, e) + '</div>' +
        '<div data-label="الحالة">' + statusHtml(r, e) + '</div>' +
        '</div>';
    }

    function khatibButtonHtml(r, e) {
      var kId = e.khatibId ? String(e.khatibId) : '';
      var name = '— اختر خطيب —';
      if (kId) {
        var k = state.khatibs.find(function (x) { return String(x.id) === kId; });
        name = k ? k.name : (r.khatib || 'خطيب ' + kId);
      }
      if (!canEdit()) {
        if (!kId) return '<span class="muted">لم يُحدد بعد</span>';
        return '<span class="row-readonly" style="display:inline-block;padding:6px 0;font-weight:600">' + esc(name) + '</span>';
      }
      var isConflict = state.conflictMosques && state.conflictMosques.indexOf(String(r.mosqueId)) >= 0;
      return '<button type="button" class="row-select khatib-trigger' + (isConflict ? ' conflict' : '') + '" data-mosque="' + esc(r.mosqueId) + '">' +
        esc(name) + '</button>';
    }

    function statusHtml(r, e) {
      if (!e.khatibId) return '<span class="badge badge-off">شاغر</span>';
      if (!canEdit()) {
        var isConfirmed = (e.status === 'confirmed');
        return '<span class="badge ' + (isConfirmed ? 'badge-volunteer' : 'badge-warn') + '">' +
          (isConfirmed ? 'مؤكد' : 'معتذر') + '</span>';
      }
      return '<select class="row-select" data-status="' + esc(r.mosqueId) + '">' +
        '<option value="confirmed"' + (e.status === 'confirmed' ? ' selected' : '') + '>مؤكد</option>' +
        '<option value="excused"' + (e.status === 'excused' ? ' selected' : '') + '>معتذر</option>' +
        '</select>';
    }

    function updateRow(mosqueId) {
      var rowEl = document.querySelector('.table-row[data-mosque="' + mosqueId + '"]');
      if (!rowEl) return;
      var r = state.rows.find(function (x) { return String(x.mosqueId) === String(mosqueId); });
      if (!r) return;

      var e = effective(r);
      var isDirty = !!(state.dirty[r.mosqueId] || state.dirty[String(r.mosqueId)]);
      var isEmpty = !e.khatibId;

      rowEl.className = 'table-row' + (isDirty ? ' dirty' : '') + (isEmpty ? ' empty-slot' : '');

      var khatibCell = rowEl.querySelector('[data-label="الخطيب"]');
      if (khatibCell) {
        khatibCell.innerHTML = khatibButtonHtml(r, e);
      }

      var statusCell = rowEl.querySelector('[data-label="الحالة"]');
      if (statusCell) {
        statusCell.innerHTML = statusHtml(r, e);
      }
    }

    function buildKhatibOptionsHtml(r, e) {
      var m = state.mosques[r.mosqueId] || state.mosques[String(r.mosqueId)] || {};
      var booked = bookedMap(String(r.mosqueId));
      var permanent = String(m.permanentKhatibId || '');
      var currentKhatibId = String(e.khatibId || '');

      var groups = [[], [], [], []];
      state.khatibs.forEach(function (k) {
        var kIdStr = String(k.id || '');
        var where = booked[kIdStr];
        var count = state.loadCount[kIdStr] || state.loadCount[k.id] || 0;
        var labelCount = count ? ' (' + count + ')' : '';

        if (where) {
          var wm = state.mosques[where] || state.mosques[String(where)] || {};
          var mosqueName = wm.name || ('مسجد ' + where);
          groups[3].push({
            id: kIdStr,
            label: k.name + labelCount + ' — ⚠️ مسند إلى: ' + mosqueName
          });
        } else if (kIdStr && kIdStr === permanent) {
          groups[0].push({ id: kIdStr, label: '★ ' + k.name + labelCount + ' — خطيب ثابت' });
        } else if ((state.prefsByKhatib[kIdStr] || state.prefsByKhatib[k.id] || new Set()).has(String(r.mosqueId))) {
          groups[1].push({ id: kIdStr, label: '♦ ' + k.name + labelCount + ' — (مستهدف/مقترح)' });
        } else {
          groups[2].push({ id: kIdStr, label: k.name + labelCount });
        }
      });

      var opts = '<option value="">— اختر خطيب —</option>';

      if (groups[0].length) {
        opts += '<optgroup label="★ الخطيب الثابت">';
        groups[0].forEach(function (o) {
          opts += '<option value="' + esc(o.id) + '"' + (String(o.id) === currentKhatibId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        });
        opts += '</optgroup>';
      }

      if (groups[1].length) {
        opts += '<optgroup label="♦ الخطباء المقترحون لهذا المسجد">';
        groups[1].forEach(function (o) {
          opts += '<option value="' + esc(o.id) + '"' + (String(o.id) === currentKhatibId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        });
        opts += '</optgroup>';
      }

      if (groups[2].length) {
        opts += '<optgroup label="الخطباء المتاحون">';
        groups[2].forEach(function (o) {
          opts += '<option value="' + esc(o.id) + '"' + (String(o.id) === currentKhatibId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        });
        opts += '</optgroup>';
      }

      if (groups[3].length) {
        opts += '<optgroup label="⚠️ خطباء مسندون لمساجد أخرى (يمكنك نقلهم هنا)">';
        groups[3].forEach(function (o) {
          opts += '<option value="' + esc(o.id) + '"' + (String(o.id) === currentKhatibId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        });
        opts += '</optgroup>';
      }

      return opts;
    }

    function openKhatibDropdown(mosqueId) {
      if (activeMosqueId === String(mosqueId) && activeTomSelect) {
        if (!activeTomSelect.isOpen) activeTomSelect.open();
        return;
      }

      destroyActiveTomSelect();

      var rowEl = document.querySelector('.table-row[data-mosque="' + mosqueId + '"]');
      if (!rowEl) return;
      var r = state.rows.find(function (x) { return String(x.mosqueId) === String(mosqueId); });
      if (!rowEl || !r) return;

      var eff = effective(r);

      // Remove conflict highlight when interacting with this row
      if (state.conflictMosques) {
        state.conflictMosques = state.conflictMosques.filter(function (id) { return String(id) !== String(mosqueId); });
      }

      var khatibCell = rowEl.querySelector('[data-label="الخطيب"]');
      if (!khatibCell) return;

      var select = document.createElement('select');
      select.className = 'row-select khatib-select';
      select.dataset.mosque = String(mosqueId);
      select.innerHTML = buildKhatibOptionsHtml(r, eff);
      select.value = eff.khatibId ? String(eff.khatibId) : '';

      khatibCell.innerHTML = '';
      khatibCell.appendChild(select);

      if (typeof TomSelect === 'undefined') {
        select.onchange = function () {
          onKhatibChange(mosqueId, this.value);
        };
        select.onblur = function () {
          setTimeout(function () {
            if (activeMosqueId === String(mosqueId)) {
              destroyActiveTomSelect();
            }
          }, 150);
        };
        activeMosqueId = String(mosqueId);
        select.focus();
        return;
      }

      activeMosqueId = String(mosqueId);
      activeTomSelect = new TomSelect(select, {
        create: false,
        placeholder: '— اختر خطيب —',
        allowEmptyOption: true,
        controlInput: null,
        plugins: ['dropdown_input'],
        direction: 'rtl',
        dropdownParent: 'body',
        render: {
          option: function(data, escape) {
            var raw = data.text || '';
            if (raw.indexOf('مسند إلى') >= 0) {
              var parts = raw.split('—');
              var namePart = escape(parts[0] || '');
              var msgPart = escape(parts.slice(1).join('—') || '');
              return '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:2px 0">' +
                '<span style="font-weight:600">' + namePart + '</span>' +
                '<span style="color:#dc2626;font-weight:bold;font-size:0.82em;background:#fee2e2;border:1px solid #fca5a5;padding:2px 8px;border-radius:12px;margin-right:6px;white-space:nowrap">' + msgPart + '</span>' +
              '</div>';
            } else if (raw.indexOf('مستهدف') >= 0 || raw.indexOf('♦') >= 0) {
              var parts2 = raw.split('—');
              var namePart2 = escape(parts2[0] || '');
              return '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:2px 0">' +
                '<span style="color:#0284c7;font-weight:600">' + namePart2 + '</span>' +
                '<span style="color:#0284c7;font-size:0.78em;background:#e0f2fe;border:1px solid #bae6fd;padding:2px 8px;border-radius:12px;font-weight:bold;margin-right:6px;white-space:nowrap">مقترح لهذا المسجد</span>' +
              '</div>';
            } else if (raw.indexOf('★') >= 0) {
              return '<div style="color:#b45309;font-weight:bold">' + escape(raw) + '</div>';
            }
            return '<div>' + escape(raw) + '</div>';
          },
          item: function(data, escape) {
            var raw = data.text || '';
            if (raw.indexOf('مسند إلى') >= 0) {
              return '<div><span style="color:#dc2626;font-weight:bold">' + escape(raw) + '</span></div>';
            } else if (raw.indexOf('مستهدف') >= 0 || raw.indexOf('♦') >= 0) {
              return '<div><span style="color:#0284c7;font-weight:bold">' + escape(raw) + '</span></div>';
            }
            return '<div>' + escape(raw) + '</div>';
          }
        },
        onChange: function (val) {
          onKhatibChange(mosqueId, val);
        }
      });

      activeTomSelect.on('dropdown_close', function () {
        setTimeout(function () {
          if (activeMosqueId === String(mosqueId)) {
            destroyActiveTomSelect();
          }
        }, 50);
      });

      activeTomSelect.focus();
      activeTomSelect.open();
    }

    function onKhatibChange(mosqueId, val) {
      var row = state.rows.find(function (r) { return String(r.mosqueId) === String(mosqueId); });
      if (!row) return;
      var cur = effective(row);
      var oldMosqueId = null;

      // إذا تم اختيار خطيب وكان محجوزاً في مسجد آخر بنفس الجمعة، يتم إلغاء إسناده من المسجد السابق
      if (val) {
        var booked = bookedMap(mosqueId);
        oldMosqueId = booked[val];
        if (oldMosqueId && String(oldMosqueId) !== String(mosqueId)) {
          var oldRow = state.rows.find(function (r) { return String(r.mosqueId) === String(oldMosqueId); });
          if (oldRow) {
            state.dirty[oldMosqueId] = { khatibId: '', status: 'unassigned' };
            if (state.dirty[oldMosqueId].khatibId === oldRow.khatibId && state.dirty[oldMosqueId].status === oldRow.status) {
              delete state.dirty[oldMosqueId];
            }
          }
        } else {
          oldMosqueId = null;
        }
      }

      state.dirty[mosqueId] = { khatibId: val, status: val ? (cur.status === 'excused' ? 'excused' : 'confirmed') : 'unassigned' };
      if (state.dirty[mosqueId].khatibId === row.khatibId && state.dirty[mosqueId].status === row.status) {
        delete state.dirty[mosqueId];
      }

      if (oldMosqueId) {
        updateRow(oldMosqueId);
      }

      setTimeout(function () {
        destroyActiveTomSelect();
        updateStickyBar();
        if (state.filterEmpty) {
          applyFilters();
        }
      }, 0);
    }

    function onStatusChange(mosqueId, val) {
      var row = state.rows.find(function (r) { return String(r.mosqueId) === String(mosqueId); });
      if (!row) return;
      var cur = effective(row);
      state.dirty[mosqueId] = { khatibId: cur.khatibId, status: val };
      if (state.dirty[mosqueId].khatibId === row.khatibId && state.dirty[mosqueId].status === row.status) {
        delete state.dirty[mosqueId];
      }
      updateRow(mosqueId);
      updateStickyBar();
    }

    function wire() {
      el('emptyBtn').onclick = function () {
        state.filterEmpty = !state.filterEmpty;
        updateStickyBar();
        applyFilters();
      };
      var ab = el('allBtn');
      if (ab) {
        ab.onclick = function () {
          state.filterEmpty = false;
          updateStickyBar();
          applyFilters();
        };
      }

      el('pdfBtn').onclick = function () {
        destroyActiveTomSelect();
        exportPdf(el('pdfArea'), 'توزيع-' + state.date);
      };
      var saveBtn = el('saveBtn');
      if (saveBtn) saveBtn.onclick = save;
      var regenBtn = el('regenBtn');
      if (regenBtn) regenBtn.onclick = regenerate;

      var s = el('mosqueSearch');
      s.oninput = function () {
        state.search = this.value;
        applyFilters();
      };
    }

    // ── إعادة التوليد ────────────────────────────────────────

    /**
     * وضعان: "استكمال" بيضيف المساجد الجديدة ويملّي الفاضي بالخطيب الثابت
     * من غير ما يلمس أي توزيع يدوي، و"تصفير" بيمسح التوزيع كله ويرجّع
     * الثابتين بس. التصفير بيتأكد مرتين لأنه بيضيّع شغل.
     */
    function regenerate() {
      if (Object.keys(state.dirty).length) {
        toast('احفظ تعديلاتك الأول أو ارجع عنها', 'warn');
        return;
      }
      el('dateNotice').innerHTML =
        '<div class="notice notice-info"><strong>إعادة توليد ' + esc(formatDate(state.date)) + '</strong>' +
        '<div style="margin:8px 0;font-size:.92em">' +
        '<div>• <strong>استكمال</strong> — يضيف المساجد اللي اتعملت بعد التوليد، ويملّي الفاضي بالخطيب الثابت. مش بيغيّر أي توزيع موجود.</div>' +
        '<div style="margin-top:4px">• <strong>تصفير</strong> — يمسح التوزيع كله ويرجّع الخطباء الثابتين فقط.</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm" id="regenFill">استكمال</button>' +
        '<button class="btn btn-sm btn-danger" id="regenReset">تصفير</button>' +
        '<button class="btn btn-sm btn-plain" id="regenCancel">إلغاء</button>' +
        '</div></div>';

      el('regenCancel').onclick = function () { el('dateNotice').innerHTML = ''; };
      el('regenFill').onclick = function () { runRegen('fill'); };
      el('regenReset').onclick = function () {
        var filled = state.rows.filter(function (r) { return r.khatibId; }).length;
        if (!confirmBox('هيتم مسح ' + filled + ' توزيع في ' + formatDate(state.date) +
                        ' ورجوع الخطباء الثابتين بس.\n\nمتأكد؟')) return;
        runRegen('reset');
      };
    }

    async function runRegen(mode) {
      el('dateNotice').innerHTML = '<div class="notice notice-info">جاري إعادة التوليد...</div>';
      try {
        var d = await api('regenerateDate', { date: state.date, mode: mode });
        state.rows = d.rows;
        state.version = d.version;
        state.dirty = {};

        var parts = [];
        if (d.cleared) parts.push('اتمسح ' + d.cleared + ' توزيع');
        if (d.addedMosques.length) parts.push('اتضاف ' + d.addedMosques.length + ' مسجد جديد');
        if (d.filled) parts.push('اتملى ' + d.filled + ' بالخطيب الثابت');
        if (!parts.length) parts.push('مفيش حاجة اتغيرت — كل حاجة محدّثة');

        var html = '<div class="notice notice-info">' + esc(parts.join('، '));
        if (d.addedMosques.length) {
          html += '<div style="margin-top:6px;font-size:.88em">المساجد المضافة: ' +
                  esc(d.addedMosques.join('، ')) + '</div>';
        }
        // الخطيب الثابت اللي كان محجوز في مسجد تاني — لازم يتقال، مش يتسكت عنه
        if (d.skipped && d.skipped.length) {
          html += '<div style="margin-top:6px;font-size:.88em;color:var(--warn)">' +
                  'خطيبها الثابت كان محجوز في مكان تاني، فسيبناها فاضية: ' +
                  esc(d.skipped.join('، ')) + '</div>';
        }
        html += '</div>';
        el('dateNotice').innerHTML = html;

        await refreshLoadCounts();
        render();
      } catch (e) {
        el('dateNotice').innerHTML = '<div class="notice notice-err">' + esc(e.message) + '</div>';
      }
    }

    // ── الحفظ ────────────────────────────────────────────────

    async function save() {
      var changes = Object.keys(state.dirty).map(function (id) {
        return { mosqueId: id, khatibId: state.dirty[id].khatibId, status: state.dirty[id].status };
      });
      if (!changes.length) return;

      var btn = el('saveBtn');
      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';

      try {
        var d = await api('saveSchedule', { date: state.date, version: state.version, changes: changes });
        state.rows = d.rows;
        state.version = d.version;
        state.dirty = {};
        toast('تم حفظ ' + changes.length + ' تعديل', 'ok');
        await refreshLoadCounts();
        render();
      } catch (e) {
        if (e.code === 'STALE_WRITE') return handleStale(e, changes);

        if (e.code === 'KHATIB_DOUBLE_BOOKED') {
          var d2 = e.details || {};
          highlight(d2.mosques || [d2.conflictMosqueId]);
        }
        toast(e.message, 'err');
      } finally {
        updateStickyBar();
      }
    }

    /** لا نكتب فوق شغل حد تاني من غير ما نسأل، ولا نرمي شغل المستخدم. */
    function handleStale(e, changes) {
      var who = (e.details.conflicts || []).map(function (c) {
        var m = state.mosques[c.mosqueId] || {};
        return (m.name || c.mosqueId) + ' (' + c.updatedBy + ')';
      }).join('، ');

      el('dateNotice').innerHTML =
        '<div class="notice notice-warn"><strong>حد تاني عدّل نفس الصفوف:</strong> ' + esc(who) +
        '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-sm btn-plain" id="reloadBtn">تحديث — اعرض نسخته</button>' +
        '<button class="btn btn-sm btn-danger" id="forceBtn">اكتب فوقه</button></div></div>';

      el('reloadBtn').onclick = function () { state.dirty = {}; load(state.date); };
      el('forceBtn').onclick = async function () {
        try {
          clearClientCache();
          var fresh = await api('getSchedule', { date: state.date });
          var d = await api('saveSchedule', { date: state.date, version: fresh.version, changes: changes });
          state.rows = d.rows; state.version = d.version; state.dirty = {};
          state.conflictMosques = [];
          el('dateNotice').innerHTML = '';
          toast('تم الحفظ فوق النسخة الأخرى', 'warn');
          render();
        } catch (err) { toast(err.message, 'err'); }
      };
      render();
    }

    function highlight(mosqueIds) {
      state.conflictMosques = (mosqueIds || []).map(String);
      state.conflictMosques.forEach(function (id) {
        var sel = document.querySelector('.table-row[data-mosque="' + id + '"] .row-select');
        if (sel) sel.classList.add('conflict');
      });
    }

    // ── تفويض الأحداث للجدول ─────────────────────────────────

    document.addEventListener('click', function (e) {
      if (!canEdit()) return;
      var btn = e.target.closest ? e.target.closest('.khatib-trigger') : null;
      if (btn && btn.dataset && btn.dataset.mosque) {
        e.preventDefault();
        openKhatibDropdown(btn.dataset.mosque);
      }
    });

    document.addEventListener('change', function (e) {
      if (!canEdit()) return;
      var target = e.target;
      if (target && target.dataset && target.dataset.status) {
        onStatusChange(target.dataset.status, target.value);
      }
    });
  </script>
</body>
</html>
