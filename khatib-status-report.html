<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير حالات الخطباء — أوقاف 15 مايو</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <a id="backBtn" href="schedule.html" class="btn btn-plain btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px">← رجوع للتوزيع</a>
        <a id="freeKhatibsBtn" href="free-khatibs.html" class="btn btn-plain btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px">🎙️ الخطباء بدون خطبة</a>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <label for="dateInput" style="font-weight:600;font-size:.9em;margin:0">التاريخ:</label>
        <input type="date" id="dateInput" style="padding:6px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9em">
      </div>
    </div>

    <h1 style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap">
      <span>📊</span>
      <span id="headingTitle">تقرير حالات وجاهزية الخطباء</span>
      <span class="total-badge" id="countBadge" style="display:none">0</span>
    </h1>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <div class="search-box" style="flex:1;min-width:220px;margin-bottom:0">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الخطيب...">
        <button id="clearSearchBtn" class="clear-btn">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <label for="statusFilter" style="font-weight:600;font-size:.9em;margin:0;white-space:nowrap">الحالة:</label>
        <select id="statusFilter" style="padding:8px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9em;background:#fff">
          <option value="">كل الحالات</option>
          <option value="ready">مستعد</option>
          <option value="excused">معتذر</option>
          <option value="unavailable">غير متواجد</option>
          <option value="no_reply">لم يرد</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <label for="assignmentFilter" style="font-weight:600;font-size:.9em;margin:0;white-space:nowrap">التكليف:</label>
        <select id="assignmentFilter" style="padding:8px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9em;background:#fff">
          <option value="">الكل</option>
          <option value="assigned">مكلف بمسجد</option>
          <option value="unassigned">غير مكلف</option>
        </select>
      </div>
    </div>

    <div class="stats-bar" id="actionsBar" style="display:none">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>العدد: </span><strong id="statsCount">0</strong>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button type="button" class="btn btn-plain btn-sm" id="exportPdfBtn">📄 PDF</button>
        <button type="button" class="btn btn-plain btn-sm" id="exportWordBtn">📝 Word</button>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/availability.js"></script>
  <script src="assets/sermon-calendar.js"></script>
  <script src="assets/khatib-status.js"></script>
  <script>
    renderNav('schedule.html');

    var _cal = SermonCalendar;
    KhatibStatus.setAvailabilityHelper(function (khatib, date) {
      return _cal.isKhatibAvailable(khatib, date || currentDate, typeof REGION_ID !== 'undefined' ? REGION_ID : '15may');
    });

    var currentDate = '';
    var allKhatibReports = [];
    var currentFiltered = [];
    var isGenerated = false;

    (async function () {
      if (!await requireAuth()) return;
      initDate();
      await loadData();
      appReady();
    })();

    function updateNavLinks() {
      if (el('backBtn')) el('backBtn').href = 'schedule.html?date=' + encodeURIComponent(currentDate);
      if (el('freeKhatibsBtn')) el('freeKhatibsBtn').href = 'free-khatibs.html?date=' + encodeURIComponent(currentDate);
    }

    function initDate() {
      var params = new URLSearchParams(window.location.search);
      currentDate = params.get('date') || '';
      if (!currentDate) {
        var fridays = nextFridays(1);
        currentDate = fridays[0] || todayIso();
      }
      el('dateInput').value = currentDate;
      updateNavLinks();
    }

    el('dateInput').addEventListener('change', function () {
      var val = this.value;
      if (!val) return;
      currentDate = val;
      updateNavLinks();
      var url = new URL(window.location.href);
      url.searchParams.set('date', val);
      window.history.replaceState({}, '', url.toString());
      loadData();
    });

    var searchInput = el('searchInput');
    var clearBtn = el('clearSearchBtn');
    var statusFilterEl = el('statusFilter');
    var assignmentFilterEl = el('assignmentFilter');

    searchInput.addEventListener('input', function () {
      clearBtn.classList.toggle('show', !!this.value);
      applyFilter();
    });

    clearBtn.addEventListener('click', function () {
      searchInput.value = '';
      clearBtn.classList.remove('show');
      applyFilter();
      searchInput.focus();
    });

    statusFilterEl.addEventListener('change', function () {
      applyFilter();
    });

    assignmentFilterEl.addEventListener('change', function () {
      applyFilter();
    });

    async function loadData() {
      var targetDate = currentDate;
      el('headingTitle').textContent = 'تقرير حالات وجاهزية الخطباء — ' + formatDate(targetDate);
      el('countBadge').style.display = 'none';
      el('actionsBar').style.display = 'none';
      showLoading(el('results'), 'جاري تحميل البيانات...');

      try {
        var results = await Promise.all([
          api('getSchedule', { date: targetDate }),
          api('listKhatibs')
        ]);

        if (currentDate !== targetDate) return;

        var schedRes = results[0];
        var khatibRes = results[1];

        if (!schedRes.exists) {
          isGenerated = false;
          allKhatibReports = [];
          currentFiltered = [];
          el('countBadge').textContent = '0';
          el('countBadge').style.display = 'inline-block';
          el('actionsBar').style.display = 'none';
          showEmpty(el('results'), 'لم يتم إنشاء جدول هذا التاريخ في شاشة التوزيع بعد');
          return;
        }

        isGenerated = true;

        var activeKhatibs = (khatibRes.khatibs || []).filter(function (k) {
          return k.active !== false && k.active !== 0;
        });

        allKhatibReports = [];
        activeKhatibs.forEach(function (k) {
          var state = KhatibStatus.resolveKhatibState(k, schedRes);
          state.availability = k.availability || null;
          allKhatibReports.push(state);
        });

        allKhatibReports.sort(function (a, b) {
          return (a.name || '').localeCompare(b.name || '', 'ar');
        });

        el('countBadge').textContent = allKhatibReports.length;
        el('countBadge').style.display = 'inline-block';

        applyFilter();
      } catch (e) {
        if (currentDate !== targetDate) return;
        showError(el('results'), e.message, function () { loadData(); });
      }
    }

    function applyFilter() {
      if (!isGenerated) return;

      var query = (searchInput.value || '').trim();
      var statusFilter = statusFilterEl ? statusFilterEl.value : '';
      var assignmentFilter = assignmentFilterEl ? assignmentFilterEl.value : '';

      var filtered = KhatibStatus.filterKhatibs(allKhatibReports, query, statusFilter, matches);

      if (assignmentFilter === 'assigned') {
        filtered = filtered.filter(function (k) { return k.isAssigned; });
      } else if (assignmentFilter === 'unassigned') {
        filtered = filtered.filter(function (k) { return !k.isAssigned; });
      }

      currentFiltered = filtered;

      var isFiltered = !!query || !!statusFilter || !!assignmentFilter;
      el('statsCount').textContent = isFiltered
        ? (currentFiltered.length + ' من ' + allKhatibReports.length)
        : allKhatibReports.length;

      if (allKhatibReports.length === 0) {
        el('actionsBar').style.display = 'none';
        showEmpty(el('results'), 'لا يوجد خطباء مسجلون في هذه المنطقة');
        return;
      }

      el('actionsBar').style.display = 'flex';

      if (currentFiltered.length === 0) {
        showEmpty(el('results'), 'لا توجد نتائج مطابقة للبحث أو الفلتر');
        return;
      }

      renderTable(currentFiltered);
    }

    function renderTable(rows) {
      var html = '<div class="table-container">' +
        '<div class="table-header" style="grid-template-columns: 2fr 1.3fr 1fr 1.5fr 2.5fr;">' +
          '<div>الخطيب</div>' +
          '<div>الموبايل</div>' +
          '<div>النوع</div>' +
          '<div>الحالة</div>' +
          '<div>التكليف والمسجد</div>' +
        '</div>';

      rows.forEach(function (k) {
        var typeBadge = '<span class="badge ' + (k.type === 'primary' ? 'badge-primary' : 'badge-volunteer') + '">' +
          (k.type === 'primary' ? 'أساسي' : 'متطوع') + '</span>';
        var phoneHtml = k.phone && k.phone.trim()
          ? '<span class="mono" dir="ltr">' + esc(k.phone) + '</span>'
          : '<span class="muted">—</span>';

        html += '<div class="table-row" style="grid-template-columns: 2fr 1.3fr 1fr 1.5fr 2.5fr;">' +
          '<div data-label="الخطيب"><strong>' + esc(k.name) + '</strong></div>' +
          '<div data-label="الموبايل">' + phoneHtml + '</div>' +
          '<div data-label="النوع">' + typeBadge + '</div>' +
          '<div data-label="الحالة">' + k.statusBadgeHtml + '</div>' +
          '<div data-label="التكليف والمسجد">' + k.assignmentContextHtml + '</div>' +
        '</div>';
      });

      html += '</div>';
      el('results').innerHTML = html;
    }

    function getExportData() {
      var title = 'تقرير حالات وجاهزية الخطباء — ' + _cal.formatDate(currentDate);
      var headers = ['الخطيب', 'الموبايل', 'النوع', 'الحالة', 'التكليف والمسجد'];
      var exportRows = currentFiltered.map(function (k) {
        return [
          k.name || '',
          k.phone || '',
          k.type === 'primary' ? 'أساسي' : 'متطوع',
          k.statusLabel || '',
          k.assignmentContextLabel || ''
        ];
      });
      return { title: title, headers: headers, rows: exportRows };
    }

    el('exportPdfBtn').addEventListener('click', function () {
      var data = getExportData();
      if (!data.rows.length) {
        toast('لا توجد بيانات للتصدير', 'warn');
        return;
      }
      exportTablePrint(data.title, data.headers, data.rows);
    });

    el('exportWordBtn').addEventListener('click', function () {
      var data = getExportData();
      if (!data.rows.length) {
        toast('لا توجد بيانات للتصدير', 'warn');
        return;
      }
      exportTableWord(data.title, data.headers, data.rows, 'تقرير-حالات-الخطباء-' + currentDate);
    });
  </script>
</body>
</html>
