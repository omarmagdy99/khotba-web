<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشر الجدول — أوقاف 15 مايو</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h1><span>📢</span> نشر الجدول للجمهور</h1>

    <div id="statusBanner" class="notice notice-info" style="font-size:1em;text-align:center;padding:14px;margin-bottom:20px">
      جاري تحميل حالة النشر...
    </div>

    <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); background: #f8fafc; padding: 20px; border-radius: 18px; margin-bottom: 24px;">
      <div class="field" style="margin:0;grid-column:1/-1">
        <label style="font-weight:700;margin-bottom:8px">طريقة النشر</label>
        <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600">
            <input type="radio" name="publishMode" value="auto" id="publishModeAuto" style="width:auto">
            <span>نشر تلقائي للجمعة القادمة</span>
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600">
            <input type="radio" name="publishMode" value="manual" id="publishModeManual" style="width:auto" checked>
            <span>اختيار يدوي للجُمع</span>
          </label>
        </div>
        <div id="autoModeHint" style="font-size:0.85em;color:var(--muted);margin-top:6px;display:none">
          الصفحة العامة هتعرض أقرب جمعة متولّدة تلقائيًا كل أسبوع — مفيش داعي تنشر كل مرة
        </div>
      </div>

      <div class="field" id="fieldChips" style="margin:0;grid-column:1/-1;transition:opacity .2s">
        <label>اختار الجُمع اللي هتظهر للناس</label>
        <div class="friday-chips" id="publishChips" style="margin-bottom:0"></div>
      </div>

      <div class="field" id="fieldFrom" style="margin:0;transition:opacity .2s">
        <label for="publishFrom">أو حدد فترة — من تاريخ</label>
        <input type="date" id="publishFrom">
      </div>

      <div class="field" id="fieldTo" style="margin:0;transition:opacity .2s">
        <label for="publishTo">إلى تاريخ</label>
        <input type="date" id="publishTo">
      </div>

      <div class="field" style="margin:0;grid-column:1/-1">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;margin-bottom:4px">
          <input type="checkbox" id="hideEmptyToggle" style="width:auto">
          إخفاء المساجد اللي مالهاش خطيب
        </label>
        <span style="font-size:0.85em;color:var(--muted);display:block">يتم تطبيق هذا التغيير على الصفحة العامة بعد الضغط على "نشر الجدول"</span>
      </div>

      <div style="display:flex;gap:10px;align-items:end;grid-column:1/-1" id="publishActions">
        <button class="btn btn-ok" id="publishBtn" style="flex:1">📢 نشر الجدول</button>
        <button class="btn btn-danger" id="unpublishBtn">إلغاء النشر</button>
      </div>
    </div>

    <h2 style="color:var(--navy);font-size:1.25em;margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span>👁️</span> معاينة ما سيظهر للجمهور
    </h2>

    <!-- Date selector tabs for preview -->
    <div class="tabs" id="previewDateTabs" style="display:none"></div>

    <div id="previewContainer"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    renderNav('publish.html');

    var currentFrom = '';
    var currentTo = '';
    var activePreviewDate = '';
    var previewDatesList = [];
    var selected = new Set();   // التواريخ اللي هتتنشر
    var generated = {};         // date -> { label, total, filled } من listDates

    (async function () {
      if (!await requireAuth()) return;
      if (!canEdit()) {
        var actionsDiv = el('publishActions');
        if (actionsDiv) actionsDiv.style.display = 'none';
      }
      await loadPublishSettings();
      appReady();
    })();

    async function loadPublishSettings() {
      showLoading(el('previewContainer'), 'جاري تحميل بيانات النشر...');
      try {
        var results = await Promise.all([api('getSettings'), api('listDates')]);
        var settings = results[0].settings || {};

        if (el('hideEmptyToggle')) {
          el('hideEmptyToggle').checked = settings.publish_hide_empty === '1';
        }

        generated = {};
        (results[1].dates || []).forEach(function (d) { generated[d.date] = d; });

        var publishMode = settings.publish_mode || '';
        if (el('publishModeAuto') && el('publishModeManual')) {
          if (publishMode === 'auto') {
            el('publishModeAuto').checked = true;
            el('publishModeManual').checked = false;
          } else {
            el('publishModeAuto').checked = false;
            el('publishModeManual').checked = true;
          }
        }

        currentFrom = settings.publish_from || '';
        currentTo = settings.publish_to || '';
        var picked = String(settings.publish_dates || '').split(',').filter(Boolean);

        var banner = el('statusBanner');
        var publicUrl = new URL('public.html', window.location.href).href;
        var linkBoxHtml =
          '<div class="mt-2.5 p-2.5 bg-white rounded-3 border d-flex align-items-center justify-content-between gap-2 flex-wrap text-start" style="border-color:#bae6fd !important">' +
            '<div class="d-flex align-items-center gap-2 overflow-hidden" style="flex:1;min-width:200px">' +
              '<span class="fs-6">🔗</span>' +
              '<a href="' + esc(publicUrl) + '" target="_blank" class="text-decoration-underline text-break fw-bold small" style="color:var(--navy)">' + esc(publicUrl) + '</a>' +
            '</div>' +
            '<button type="button" class="btn btn-sm btn-ok shadow-sm px-3 rounded-pill" onclick="copyPublicLink(\'' + esc(publicUrl) + '\')">' +
              '📋 نسخ رابط النشر' +
            '</button>' +
          '</div>';

        if (publishMode === 'auto') {
          var autoTarget = getAutoTargetDate();
          if (autoTarget) {
            var autoDateText = formatDate(autoTarget) + (generated[autoTarget] && generated[autoTarget].label ? ' — ' + generated[autoTarget].label : '');
            banner.className = 'notice notice-info';
            banner.innerHTML =
              '<div>📌 <strong>النشر تلقائي — المعروض حاليًا:</strong> ' + esc(autoDateText) + '</div>' +
              linkBoxHtml;
          } else {
            banner.className = 'notice notice-warn';
            banner.innerHTML =
              '<div>⚠️ <strong>النشر تلقائي — تحذير:</strong> لا توجد أي جمعة متولّدة قادمة في النظام.</div>' +
              linkBoxHtml;
          }
          selected = new Set(nextFridays(1));
        } else if (currentFrom && currentTo) {
          // النشر القديم كان فترة، والجديد تواريخ بعينها
          selected = new Set(picked.length ? picked : datesInRange(currentFrom, currentTo));
          var publishedText = picked.length
            ? picked.map(formatDate).join('، ')
            : 'من ' + formatDate(currentFrom) + ' إلى ' + formatDate(currentTo);

          banner.className = 'notice notice-info';
          banner.innerHTML =
            '<div>📌 <strong>المنشور حاليًا للجمهور:</strong> ' + esc(publishedText) + '</div>' +
            linkBoxHtml;
        } else {
          banner.className = 'notice notice-warn';
          banner.innerHTML = '⚠️ <strong>لم يتم نشر أي جدول حاليًا.</strong> الخدمة العامة متوقفة حتى تقوم بالنشر.';
          selected = new Set([nextFridays(1)[0]]);
        }

        syncRangeInputs();
        renderChips();
        updateModeUI();
        await updatePreview();
      } catch (e) {
        showError(el('previewContainer'), e.message, loadPublishSettings);
      }
    }

    function getAutoTargetDate() {
      var today = todayIso();
      var dates = Object.keys(generated).filter(function (d) {
        return d >= today;
      }).sort();
      return dates.length ? dates[0] : null;
    }

    function updateModeUI() {
      var isAuto = el('publishModeAuto') && el('publishModeAuto').checked;
      if (el('autoModeHint')) {
        el('autoModeHint').style.display = isAuto ? 'block' : 'none';
      }
      var fieldChips = el('fieldChips');
      var fieldFrom = el('fieldFrom');
      var fieldTo = el('fieldTo');
      if (fieldChips) {
        fieldChips.style.opacity = isAuto ? '0.4' : '1';
        fieldChips.style.pointerEvents = isAuto ? 'none' : 'auto';
      }
      if (fieldFrom) {
        fieldFrom.style.opacity = isAuto ? '0.4' : '1';
        fieldFrom.style.pointerEvents = isAuto ? 'none' : 'auto';
      }
      if (fieldTo) {
        fieldTo.style.opacity = isAuto ? '0.4' : '1';
        fieldTo.style.pointerEvents = isAuto ? 'none' : 'auto';
      }
      if (el('publishFrom')) el('publishFrom').disabled = isAuto;
      if (el('publishTo')) el('publishTo').disabled = isAuto;
      var chips = el('publishChips') ? el('publishChips').querySelectorAll('button') : [];
      for (var i = 0; i < chips.length; i++) {
        chips[i].disabled = isAuto || !canEdit();
      }
    }

    if (el('publishModeAuto')) el('publishModeAuto').addEventListener('change', onModeChange);
    if (el('publishModeManual')) el('publishModeManual').addEventListener('change', onModeChange);

    async function onModeChange() {
      updateModeUI();
      await updatePreview();
    }

    /** كل الجُمع والتواريخ المتولّدة (زي المناسبات) اللي بين التاريخين. */
    function datesInRange(from, to) {
      var out = {};
      var p = from.split('-');
      var cur = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
      var iso = from;
      while (iso <= to) {
        if (cur.getUTCDay() === 5) out[iso] = true;
        cur.setUTCDate(cur.getUTCDate() + 1);
        iso = cur.toISOString().slice(0, 10);
      }
      Object.keys(generated).forEach(function (d) { if (d >= from && d <= to) out[d] = true; });
      return Object.keys(out).sort();
    }

    /** الأزرار: الجُمع الجاية + أي تاريخ متولّد جاي (مناسبات) + المختار حاليًا. */
    function renderChips() {
      var today = todayIso();
      var set = {};
      nextFridays(6).forEach(function (d) { set[d] = true; });
      Object.keys(generated).forEach(function (d) { if (d >= today) set[d] = true; });
      selected.forEach(function (d) { set[d] = true; });

      var isAuto = el('publishModeAuto') && el('publishModeAuto').checked;
      var box = el('publishChips');
      box.innerHTML = Object.keys(set).sort().map(function (d) {
        var g = generated[d];
        var on = selected.has(d);
        var text = formatDate(d) + (g && g.label ? ' — ' + g.label : '');
        var hint = g ? ('متوزع ' + (g.filled || 0) + ' من ' + g.total) : 'لسه متولّدتش في شاشة التوزيع';
        return '<button type="button" class="chip' + (on ? ' active' : '') + '" data-date="' + d + '"' +
          ' title="' + esc(hint) + '"' + (g ? '' : ' style="border-style:dashed"') + ((!canEdit() || isAuto) ? ' disabled' : '') + '>' +
          (on ? '✓ ' : '') + esc(text) + '</button>';
      }).join('');

      box.querySelectorAll('.chip').forEach(function (c) {
        c.onclick = function () {
          if (el('publishModeAuto') && el('publishModeAuto').checked) return;
          var d = c.dataset.date;
          if (selected.has(d)) selected.delete(d); else { selected.add(d); activePreviewDate = d; }
          syncRangeInputs();
          renderChips();
          updatePreview();
        };
      });
    }

    function syncRangeInputs() {
      var list = Array.from(selected).sort();
      el('publishFrom').value = list[0] || '';
      el('publishTo').value = list[list.length - 1] || '';
    }

    // الفترة بتختار كل الجُمع اللي فيها — وبعدها تقدر تشيل أو تزود بالأزرار
    function onRangeChange() {
      var from = el('publishFrom').value;
      var to = el('publishTo').value;
      if (!from || !to) return;
      if (from > to) {
        toast('تاريخ البداية يجب أن يكون قبل أو يساوي تاريخ النهاية', 'warn');
        return;
      }
      selected = new Set(datesInRange(from, to));
      renderChips();
      updatePreview();
    }
    el('publishFrom').addEventListener('change', onRangeChange);
    el('publishTo').addEventListener('change', onRangeChange);

    function copyPublicLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          toast('تم نسخ رابط النشر بنجاح 📋', 'ok');
        }).catch(function () {
          fallbackCopy(url);
        });
      } else {
        fallbackCopy(url);
      }
    }

    function fallbackCopy(url) {
      var input = document.createElement('input');
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      toast('تم نسخ رابط النشر بنجاح 📋', 'ok');
    }

    async function updatePreview() {
      var isAuto = el('publishModeAuto') && el('publishModeAuto').checked;

      if (isAuto) {
        el('previewDateTabs').style.display = 'none';
        var autoDate = getAutoTargetDate();
        if (!autoDate) {
          showEmpty(el('previewContainer'), 'لا توجد جمعة قادمة متولّدة لعرضها');
          return;
        }
        activePreviewDate = autoDate;
        await loadPreviewForDate(activePreviewDate);
        return;
      }

      previewDatesList = Array.from(selected).sort();

      if (previewDatesList.length === 0) {
        el('previewDateTabs').style.display = 'none';
        showEmpty(el('previewContainer'), 'اختار جمعة واحدة على الأقل من الأزرار');
        return;
      }

      // If active preview date not in list, pick first
      if (!previewDatesList.includes(activePreviewDate)) {
        activePreviewDate = previewDatesList[0];
      }

      renderDateTabs();
      await loadPreviewForDate(activePreviewDate);
    }

    function renderDateTabs() {
      var tabsContainer = el('previewDateTabs');
      if (previewDatesList.length <= 1) {
        tabsContainer.style.display = 'none';
        return;
      }

      var html = previewDatesList.map(function (d) {
        var isActive = d === activePreviewDate ? ' active' : '';
        return '<button type="button" class="tab-btn' + isActive + '" onclick="switchPreviewDate(\'' + d + '\')">' +
          esc(formatDate(d)) +
        '</button>';
      }).join('');

      tabsContainer.innerHTML = html;
      tabsContainer.style.display = 'flex';
    }

    async function switchPreviewDate(dIso) {
      activePreviewDate = dIso;
      renderDateTabs();
      await loadPreviewForDate(dIso);
    }

    var currentPreviewRows = [];

    async function loadPreviewForDate(dIso) {
      var previewBox = el('previewContainer');
      showLoading(previewBox, 'جاري تحميل معاينة جمعة ' + formatDate(dIso) + '...');

      try {
        var res = await api('getSchedule', { date: dIso });
        if (dIso !== activePreviewDate) return; // اتغيّر الاختيار والرد ده قديم
        // نفس ترتيب شاشة التوزيع (رقم المسجد) — السيرفر بيرجّعها مترتبة
        currentPreviewRows = res.rows || [];
        renderPreview();
      } catch (e) {
        showError(previewBox, e.message, function () { loadPreviewForDate(dIso); });
      }
    }

    function renderPreview() {
      var previewBox = el('previewContainer');
      if (!currentPreviewRows.length) {
        showEmpty(previewBox, 'لم يتم توليد توزيع لهذه الجمعة بعد (' + formatDate(activePreviewDate) + ')');
        return;
      }

      var hideEmpty = el('hideEmptyToggle') ? el('hideEmptyToggle').checked : false;
      var visibleRows = currentPreviewRows.filter(function (r) {
        if (!hideEmpty) return true;
        return r.status === 'confirmed' && r.khatib && r.khatib.trim();
      });

      var cols = 'grid-template-columns: 50px 2fr 1.2fr 2fr;';
      var html = '<div style="background:#fff; padding:18px; border-radius:18px; border:1px solid var(--line);">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">' +
          '<div>' +
            '<h3 style="color:var(--navy); font-size:1.15em; margin:0">جدول خطب الجمعة — ' + esc(formatDate(activePreviewDate)) + '</h3>' +
            '<p style="color:var(--muted); font-size:.85em; margin:4px 0 0 0">هذه المعاينة توضح تماماً الشكل الذي يظهر للجمهور عند زيارة الرابط العام</p>' +
          '</div>' +
          '<div style="display:flex; gap:8px">' +
            '<button type="button" class="btn btn-sm btn-plain" id="previewPdfBtn">📄 PDF</button>' +
            '<button type="button" class="btn btn-sm btn-plain" id="previewWordBtn">📝 Word</button>' +
          '</div>' +
        '</div>';

      if (visibleRows.length === 0) {
        html += '<div class="state"><span class="state-icon">🔍</span><p>لا توجد مساجد بخطيب مؤكد في هذه الجمعة</p></div></div>';
        previewBox.innerHTML = html;
        wirePreviewExport(visibleRows);
        return;
      }

      html += '<div class="table-container">' +
        '<div class="table-header" style="' + cols + '">' +
          '<div>#</div>' +
          '<div>🕌 المسجد</div>' +
          '<div>📍 المجاورة</div>' +
          '<div>🎙️ الخطيب</div>' +
        '</div>';

      visibleRows.forEach(function (r, i) {
        // للجمهور: المعتذر مايظهرش اسمه، زي الصفحة العامة بالظبط
        var khatibText = r.status === 'confirmed' && r.khatib && r.khatib.trim()
          ? '<strong>' + esc(r.khatib) + '</strong>'
          : '<span class="muted">لم يُحدد بعد</span>';

        html += '<div class="table-row" style="' + cols + '">' +
          '<div data-label="رقم المسجد"><span class="mosque-no">' + (i + 1) + '</span></div>' +
          '<div data-label="المسجد"><strong>' + esc(r.mosque) + '</strong></div>' +
          '<div data-label="المجاورة"><span class="area-badge">' + esc(r.mujawra || '—') + '</span></div>' +
          '<div data-label="الخطيب">' + khatibText + '</div>' +
        '</div>';
      });

      html += '</div></div>';
      previewBox.innerHTML = html;
      wirePreviewExport(visibleRows);
    }

    function wirePreviewExport(visibleRows) {
      var pdfBtn = el('previewPdfBtn');
      var wordBtn = el('previewWordBtn');
      var title = 'جدول خطب الجمعة — ' + formatDate(activePreviewDate);
      var headers = ['المسجد', 'المجاورة', 'الخطيب'];
      var exportRows = visibleRows.map(function (r) {
        var khatib = (r.status === 'confirmed' && r.khatib && r.khatib.trim())
          ? r.khatib
          : 'لم يُحدد بعد';
        return [r.mosque || '', r.mujawra || '—', khatib];
      });

      if (pdfBtn) {
        pdfBtn.onclick = function () {
          exportTablePrint(title, headers, exportRows);
        };
      }
      if (wordBtn) {
        wordBtn.onclick = function () {
          exportTableWord(title, headers, exportRows, 'جدول-خطب-' + activePreviewDate);
        };
      }
    }

    if (el('hideEmptyToggle')) {
      el('hideEmptyToggle').addEventListener('change', function () {
        renderPreview();
      });
    }

    // Publish button action
    el('publishBtn').addEventListener('click', async function () {
      var isAuto = el('publishModeAuto') && el('publishModeAuto').checked;
      var hideEmpty = el('hideEmptyToggle') ? el('hideEmptyToggle').checked : false;

      var btn = el('publishBtn');
      btn.disabled = true;
      btn.textContent = 'جاري النشر...';

      if (isAuto) {
        try {
          await api('publishRange', { mode: 'auto', hideEmpty: hideEmpty });
          toast('تم تفعيل النشر التلقائي بنجاح 📢', 'ok');
          await loadPublishSettings();
        } catch (e) {
          toast(e.message, 'err');
        } finally {
          btn.disabled = false;
          btn.textContent = '📢 نشر الجدول';
        }
        return;
      }

      var dates = Array.from(selected).sort();
      if (!dates.length) {
        toast('اختار جمعة واحدة على الأقل للنشر', 'err');
        btn.disabled = false;
        btn.textContent = '📢 نشر الجدول';
        return;
      }
      var notReady = dates.filter(function (d) { return !generated[d]; });
      if (notReady.length && !confirmBox('الجُمع دي لسه متولّدتش في شاشة التوزيع ومش هتظهر للناس:\n' +
          notReady.map(formatDate).join('، ') + '\n\nتكمل النشر؟')) {
        btn.disabled = false;
        btn.textContent = '📢 نشر الجدول';
        return;
      }

      try {
        await api('publishRange', { dates: dates, hideEmpty: hideEmpty });
        toast('تم نشر الجدول للجمهور بنجاح 📢', 'ok');
        await loadPublishSettings();
      } catch (e) {
        toast(e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = '📢 نشر الجدول';
      }
    });

    // Unpublish button action
    el('unpublishBtn').addEventListener('click', async function () {
      var msg = 'هل أنت تأكد من إلغاء نشر الجدول؟\nسيؤدي هذا إلى إخفاء الجدول عن جميع زوار الموقع العام فورًا.';
      if (!confirmBox(msg)) return;

      var btn = el('unpublishBtn');
      btn.disabled = true;

      try {
        await api('publishRange', { from: '', to: '' });
        toast('تم إلغاء نشر الجدول بنجاح', 'ok');
        await loadPublishSettings();
      } catch (e) {
        toast(e.message, 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
