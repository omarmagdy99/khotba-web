<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول — أوقاف 15 مايو</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-light">
  <div class="container my-5" style="max-width:420px">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-2" style="color:var(--navy)"><span>🕌</span> أوقاف 15 مايو</h1>
        <p class="text-center text-muted small mb-4">تنسيق خطب الجمعة</p>

        <form id="loginForm" class="vstack gap-3" autocomplete="on">
          <div>
            <label for="username" class="form-label fw-bold text-secondary small mb-1">اسم المستخدم</label>
            <input type="text" id="username" name="username" class="form-control form-control-lg rounded-3 fs-6" autocomplete="username" required>
          </div>
          <div>
            <label for="password" class="form-label fw-bold text-secondary small mb-1">كلمة المرور</label>
            <input type="password" id="password" name="password" class="form-control form-control-lg rounded-3 fs-6" autocomplete="current-password" required>
          </div>
          <div id="loginError" class="notice notice-err" style="display:none"></div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-bold shadow-sm" id="loginBtn" style="background:var(--navy);border:none">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // لو فيه توكن صالح، عدّي على طول. الغطاء بيفضل ظاهر أثناء التحقق
    // عشان نموذج الدخول ميرفرفش لو المستخدم داخل أصلاً.
    (async function () {
      if (!getToken()) { appReady(); return; }
      try {
        await api('whoami');
        location.href = 'schedule.html';
      } catch (e) {
        clearToken();
        appReady();
      }
    })();

    el('loginForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var btn = el('loginBtn'), errBox = el('loginError');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      try {
        var data = await api('login', {
          username: el('username').value.trim(),
          password: el('password').value,
        });
        setToken(data.token);
        localStorage.setItem('awqaf_name', data.displayName);
        location.href = 'schedule.html';
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
        el('password').value = '';
        el('password').focus();
      } finally {
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    });
  </script>
</body>
</html>
